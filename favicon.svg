<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2E"/>
      <stop offset="100%" stop-color="#070F1E"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#8C52FF"/>
    </linearGradient>
    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow & Ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#ringGrad)" stroke-width="14" opacity="0.85" filter="url(#glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#ringGrad)" stroke-width="8"/>

  <!-- Inner Subtle Accent Circle -->
  <circle cx="256" cy="256" r="176" fill="#0A1626" stroke="#1E3352" stroke-width="4"/>

  <!-- Modern Institutional Dollar Sign ($) -->
  <g fill="url(#dollarGrad)" filter="url(#glow)">
    <!-- Central Vertical Bars -->
    <rect x="242" y="90" width="28" height="332" rx="14"/>
    
    <!-- Dollar Typography ($) -->
    <text x="256" y="348" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="290" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#dollarGrad)">$</text>
  </g>
</svg>
